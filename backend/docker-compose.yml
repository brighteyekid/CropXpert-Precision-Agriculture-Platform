version: "3.9"

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./ml/models:/app/ml/models
      - ./ml/data:/app/ml/data
      - ./cropxpert.db:/app/cropxpert.db
    depends_on:
      - mosquitto
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    command: mosquitto -c /mosquitto-no-auth.conf
    restart: unless-stopped

volumes:
  mosquitto_data:
  mosquitto_log:
